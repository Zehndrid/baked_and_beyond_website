<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #F5EFE6;
            color: #2C3E50;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #4B799E;
        }
        table {
            width: 100%;
            max-width: 1000px;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        th, td {
            padding: 12px 15px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #4B799E;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <h1>Baked & Beyond - Customer Orders</h1>

    <table>
        <thead>
            <tr>
                <th>Order ID</th>
                <th>Customer Name</th>
                <th>Contact Info</th>
                <th>Flavor</th>
                <th>Quantity</th>
                <th>Payment Method</th>
            </tr>
        </thead>
        <tbody>
            {% for order in orders %}
            <tr>
                <td>{{ order.id }}</td>
                <td>{{ order.customer_name }}</td>
                <td>{{ order.contact }}</td>
                <td>{{ order.flavor }}</td>
                <td>{{ order.quantity }}</td>
                <td>{{ order.payment }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="6" style="text-align: center;">No orders yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
